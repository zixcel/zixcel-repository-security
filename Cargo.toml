[package]
name = "zixcel-repository-security"
version = "0.1.0"
edition = "2024"
description = "Bounded local repository inspection with pinned Gitleaks"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-repository-security"
publish = false
include = ["src/*.rs", "scripts/**", "assets/**", "examples/**", "rust-toolchain.toml", "tests/*.rs", "tests/gitleaks-pin.json", "Cargo.toml", "Cargo.lock", "README.md", "docs/**", "LICENSE*", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
base64 = "0.22.1"
caseless = "0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = "1.4.0"
flate2 = "1.1.9"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.27.0"
toml = "0.8.23"
unicode-normalization = "0.1.25"
wait-timeout = "0.2.1"
