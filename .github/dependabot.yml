version: 2
updates:
- package-ecosystem: cargo
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gomod
  directory: /scripts/gitleaks
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /.github/actions/dependabot-merge
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    compatible-updates:
      patterns: ['*']
      update-types: [minor, patch]
