name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select external build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zixcel-security-target" >> "$GITHUB_ENV"
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          bash tests/engine-candidate.sh
          bash tests/detector-release.sh
      - name: Verify and provision the immutable published detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-published-detector.sh "$RUNNER_TEMP/published-detector"
          cargo run --locked -- provision-gitleaks --archive "$RUNNER_TEMP/published-detector/engine.tar.gz" --output-directory "$RUNNER_TEMP/zixcel-gitleaks-production"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detector-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/published-detector/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Test Rust policy and the published detector consumer
        env:
          ZIXCEL_TEST_GITLEAKS_CONFIG: ${{ runner.temp }}/zixcel-gitleaks-production/config.json
          ZIXCEL_TEST_PINNED_GITLEAKS_CONFIG: ${{ runner.temp }}/zixcel-gitleaks-production/config.json
        run: cargo test --locked -- --test-threads=1
      - name: Verify community policy and source distribution
        run: |
          cargo run --locked -- check-oss-policy --root "$PWD"
          cargo package --locked
