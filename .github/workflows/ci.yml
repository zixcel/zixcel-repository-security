name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select external build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zixcel-security-target" >> "$GITHUB_ENV"
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build and audit curated Gitleaks
        run: bash scripts/build-gitleaks.sh "$RUNNER_TEMP/curated-engine"
      - name: Rebuild the independently pinned detector baseline
        run: |
          git init -q "$RUNNER_TEMP/pinned-detector-recipe"
          git -C "$RUNNER_TEMP/pinned-detector-recipe" fetch -q --depth 1 https://github.com/zixcel/zixcel-repository-security.git 02f4e9a6318208c4516dd6b274349de1275b323d
          git -C "$RUNNER_TEMP/pinned-detector-recipe" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-detector-recipe" rev-parse HEAD)" = 02f4e9a6318208c4516dd6b274349de1275b323d
          bash "$RUNNER_TEMP/pinned-detector-recipe/scripts/build-gitleaks.sh" "$RUNNER_TEMP/production-engine"
          cargo run --locked -- provision-gitleaks --executable "$RUNNER_TEMP/production-engine/gitleaks" --output-directory "$RUNNER_TEMP/zixcel-gitleaks-production"
      - name: Bind audited candidate bytes to the scanner test configuration
        run: bash scripts/candidate-engine-config.sh "$RUNNER_TEMP/curated-engine" "$RUNNER_TEMP/candidate-engine-config.json"
      - name: Test candidate detection and pinned production provisioning
        env:
          ZIXCEL_TEST_GITLEAKS_CONFIG: ${{ runner.temp }}/candidate-engine-config.json
          ZIXCEL_TEST_PINNED_GITLEAKS_CONFIG: ${{ runner.temp }}/zixcel-gitleaks-production/config.json
        run: cargo test --locked
      - name: Verify community policy and source distribution
        run: |
          cargo run --locked -- check-oss-policy --root "$PWD"
          cargo package --locked
