name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/zixcel-security-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Provision SHA-pinned public Gitleaks
        run: cargo run --locked -- provision-gitleaks --download --output-directory "$RUNNER_TEMP/zixcel-gitleaks"
      - name: Test with actual Gitleaks and synthetic data
        env:
          ZIXCEL_TEST_GITLEAKS_CONFIG: ${{ runner.temp }}/zixcel-gitleaks/config.json
        run: cargo test --locked
      - name: Verify community policy and source distribution
        run: |
          cargo run --locked -- check-oss-policy --root "$PWD"
          cargo package --locked
