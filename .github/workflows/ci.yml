name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select external build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zixcel-security-target" >> "$GITHUB_ENV"
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          bash tests/engine-candidate.sh
      - name: Build and audit curated Gitleaks
        run: bash scripts/build-gitleaks.sh "$RUNNER_TEMP/curated-engine"
      - name: Rebuild and freshly audit the published detector recipe
        run: |
          published_source=$(jq -er ' .source ' tests/gitleaks-pin.json)
          [[ "$published_source" =~ ^[a-f0-9]{40}$ ]]
          git init -q "$RUNNER_TEMP/pinned-detector-recipe"
          git -C "$RUNNER_TEMP/pinned-detector-recipe" fetch -q --depth 1 https://github.com/zixcel/zixcel-repository-security.git "$published_source"
          git -C "$RUNNER_TEMP/pinned-detector-recipe" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-detector-recipe" rev-parse HEAD)" = "$published_source"
          bash "$RUNNER_TEMP/pinned-detector-recipe/scripts/build-gitleaks.sh" "$RUNNER_TEMP/production-engine"
          cargo run --locked -- provision-gitleaks --executable "$RUNNER_TEMP/production-engine/gitleaks" --output-directory "$RUNNER_TEMP/zixcel-gitleaks-reproduced"
      - name: Verify and provision the anonymous published production archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/published-detector.tar.gz"
          url=$(jq -er '.url' tests/gitleaks-pin.json)
          digest=$(jq -er '.archive_sha256' tests/gitleaks-pin.json)
          source=$(jq -er '.source' tests/gitleaks-pin.json)
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 67108864 "$url" --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          gh attestation verify "$archive" --repo zixcel/zixcel-repository-security --signer-workflow zixcel/zixcel-repository-security/.github/workflows/publish-detector.yml --source-digest "$source" --signer-digest "$source" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$RUNNER_TEMP/detector-provenance.json"
          cargo run --locked -- provision-gitleaks --archive "$archive" --output-directory "$RUNNER_TEMP/zixcel-gitleaks-production"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detector-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/detector-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Bind audited candidate bytes to the scanner test configuration
        run: bash scripts/candidate-engine-config.sh "$RUNNER_TEMP/curated-engine" "$RUNNER_TEMP/candidate-engine-config.json"
      - name: Test candidate detection and pinned production provisioning
        env:
          ZIXCEL_TEST_GITLEAKS_CONFIG: ${{ runner.temp }}/candidate-engine-config.json
          ZIXCEL_TEST_PINNED_GITLEAKS_CONFIG: ${{ runner.temp }}/zixcel-gitleaks-production/config.json
        run: cargo test --locked
      - name: Verify community policy and source distribution
        run: |
          cargo run --locked -- check-oss-policy --root "$PWD"
          cargo package --locked
      - name: Record audited detector distribution candidate
        run: bash scripts/engine-candidate.sh "$RUNNER_TEMP/curated-engine" "$RUNNER_TEMP/engine-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detector-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-candidate/
          if-no-files-found: error
          retention-days: 30
