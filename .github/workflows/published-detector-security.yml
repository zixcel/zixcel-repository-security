name: Published detector security
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  published-detector-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact published bytes with current vulnerability data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit-published-detector.sh "$RUNNER_TEMP/published-audit-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-security-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-audit-evidence/
          if-no-files-found: warn
          retention-days: 30
