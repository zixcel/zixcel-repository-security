name: Repository configuration observer
on:
  pull_request:
  push:
    branches: [main]
    tags: ['observer/v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select external build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/repository-observer-target" >> "$GITHUB_ENV"
      - name: Install declared compiler
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check observer boundaries and library consumers
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --locked -p zixcel-repository-observer --all-targets -- -D warnings
          cargo +1.97.1 test --locked -p zixcel-repository-observer -- --test-threads=1
          cargo +1.97.1 test --locked -p zixcel-repository-observer --features serde_json/preserve_order -- --test-threads=1
          cargo +1.97.1 build --locked --release -p zixcel-repository-observer
      - name: Audit the resolved observer and build tool graphs
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features --root "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/cargo-audit" audit --deny warnings
          "$RUNNER_TEMP/audit/bin/cargo-audit" audit --file tools/native-release/Cargo.lock --deny warnings
      - name: Bundle exactly this source with dependency notices
        env:
          CARGO: cargo
        run: |
          cargo +1.97.1 fmt --manifest-path tools/native-release/Cargo.toml -- --check
          cargo +1.97.1 clippy --locked --manifest-path tools/native-release/Cargo.toml -- -D warnings
          cargo +1.97.1 run --locked --manifest-path tools/native-release/Cargo.toml -- "$GITHUB_SHA" "$CARGO_TARGET_DIR/release/zix-repository-observer" "$RUNNER_TEMP/observer-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-observer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observer-dist/*.tar.gz
            ${{ runner.temp }}/observer-dist/*.sha256
          if-no-files-found: error
          retention-days: 7
