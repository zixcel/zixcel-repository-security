name: Detector candidate acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gitleaks/**
      - scripts/build-gitleaks.sh
      - scripts/prepare-detector-go.sh
      - scripts/gitleaks-notices.sh
      - scripts/engine-candidate.sh
      - scripts/verify-engine-candidate.sh
      - scripts/candidate-engine-config.sh
      - scripts/verify-binary-audit.sh
      - .github/workflows/detector-candidate.yml
permissions:
  contents: read
  attestations: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Build fallback detector and audit actual compiled code
        run: bash scripts/build-gitleaks.sh "$RUNNER_TEMP/curated-engine"
      - name: Bind candidate and verify the existing published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
        run: |
          bash scripts/candidate-engine-config.sh "$RUNNER_TEMP/curated-engine" "$RUNNER_TEMP/candidate-config.json"
          bash scripts/fetch-published-detector.sh "$RUNNER_TEMP/published"
          cargo run --locked -- provision-gitleaks --archive "$RUNNER_TEMP/published/engine.tar.gz" --output-directory "$RUNNER_TEMP/production"
      - name: Candidate and consumer acceptance
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
          ZIXCEL_TEST_GITLEAKS_CONFIG: ${{ runner.temp }}/candidate-config.json
          ZIXCEL_TEST_PINNED_GITLEAKS_CONFIG: ${{ runner.temp }}/production/config.json
          ZIXCEL_TEST_PINNED_GITLEAKS_ARCHIVE: ${{ runner.temp }}/published/engine.tar.gz
        run: cargo test --locked -- --test-threads=1
      - name: Record the tested bytes for independent publication
        run: bash scripts/engine-candidate.sh "$RUNNER_TEMP/curated-engine" "$RUNNER_TEMP/engine-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detector-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-candidate/
          if-no-files-found: error
          retention-days: 30
