name: Dependency merge policy tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-merge-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.29.3'
          run_install: false
      - run: pnpm --dir .github/actions/dependabot-merge install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir .github/actions/dependabot-merge test
      - run: pnpm --dir .github/actions/dependabot-merge typecheck
