name: Verify versioned repository observer
on:
  push:
    tags: ['observer/v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: repository-observer-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zixcel/zixcel-repository-security'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      filename: ${{ steps.verify.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact accepted main source and download its unchanged candidate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^observer/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for workflow in ci.yml oss-policy.yml dependency-policy-tests.yml repository-observer.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/workflow-runs.json"
            jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event=="push")]|sort_by(.run_number)|last|.conclusion=="success"' "$RUNNER_TEMP/workflow-runs.json"
          done
          candidate=$(jq -er --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event=="push")]|sort_by(.run_number)|last|.id' "$RUNNER_TEMP/workflow-runs.json")
          [[ "$candidate" =~ ^[0-9]+$ ]]
          gh run download "$candidate" --repo "$GITHUB_REPOSITORY" --name "repository-observer-$GITHUB_SHA" --dir "$RUNNER_TEMP/observer-dist"
          cd "$RUNNER_TEMP/observer-dist"
          version=${GITHUB_REF_NAME#observer/v}
          archive="zixcel-repository-observer-v$version-x86_64-unknown-linux-gnu.tar.gz"
          test "$(find . -maxdepth 1 -type f | wc -l)" = 2
          read -r digest filename < SHA256SUMS
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          test "$filename" = "$archive"
          test "$(sha256sum "$archive" | cut -d ' ' -f1)" = "$digest"
          tar -xOf "$archive" "${archive%.tar.gz}/RELEASE.json" > "$RUNNER_TEMP/observer-release.json"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$version" '.schema=="zix-repository-observer-release/v1" and .source==$sha and .version==$version and .package=="zixcel-repository-observer" and .repository=="https://github.com/zixcel/zixcel-repository-security" and .target=="x86_64-unknown-linux-gnu"' "$RUNNER_TEMP/observer-release.json"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: reviewed-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observer-dist/*.tar.gz
            ${{ runner.temp }}/observer-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.repository == 'zixcel/zixcel-repository-security' && startsWith(github.ref, 'refs/tags/observer/v')
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: observer-public
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/observer-dist
      - name: Publish the exact tested archive once and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha256 }}
          ARCHIVE: ${{ needs.verify.outputs.filename }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_REF_NAME" =~ ^observer/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd "$RUNNER_TEMP/observer-dist"
          test "$(cat SHA256SUMS)" = "$EXPECTED_SHA  $ARCHIVE"
          test "$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)" = "$EXPECTED_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-error"; then
            jq -e --arg sha "$GITHUB_SHA" '.target_commitish==$sha and .draft==false and .prerelease==false' "$RUNNER_TEMP/existing-release.json"
          else
            grep -q '(HTTP 404)' "$RUNNER_TEMP/release-error"
            test "$GITHUB_RUN_ATTEMPT" = 1
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS --repo "$GITHUB_REPOSITORY" --latest=false --verify-tag --target "$GITHUB_SHA" --title "Repository observer $GITHUB_REF_NAME" --notes "Read-only GitHub configuration observer; Linux/WSL GNU binary. Source $GITHUB_SHA; archive SHA256 $EXPECTED_SHA. Settings changes and credential enrollment are not implemented."
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/readback"
          test "$(sha256sum "$RUNNER_TEMP/readback/$ARCHIVE" | cut -d ' ' -f1)" = "$EXPECTED_SHA"
