name: OSS policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oss-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/zixcel-security-policy-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify repository policy
        run: cargo run --locked -- check-oss-policy --root "$PWD"
