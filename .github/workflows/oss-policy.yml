name: OSS policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oss-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select external build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zixcel-security-policy-target" >> "$GITHUB_ENV"
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify repository policy
        run: cargo run --locked -- check-oss-policy --root "$PWD"
